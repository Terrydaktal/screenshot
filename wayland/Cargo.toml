[package]
name = "screenshot"
version = "0.1.8"
edition = "2021"

[[bin]]
name = "screenshot"
path = "src/main.rs"

[[bin]]
name = "screenshot-daemon"
path = "src/daemon.rs"

[[bin]]
name = "screenshot-shortcut-setup"
path = "src/shortcut_setup.rs"

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.44"
eframe = { version = "0.33.3", default-features = false, features = ["wayland", "glow", "default_fonts"] }
home = "0.5.12"
image = "0.25.10"
resvg = "0.43.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zbus = "5.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
debug-assertions = false
overflow-checks = false
incremental = false
split-debuginfo = "off"
